// App module. Mirrors the app/build.gradle string xbuild
// generated (gradle/mod.rs) — namespace/applicationId, the SDK
// levels, version. No `assetPacks` (the OGGs are include_bytes!'d
// in src/sounds.rs — the asset-pack path was always dead) and no
// `dependencies` (manifest.yaml declared none).
//
// Additions over the xbuild template, all required to replace
// what xbuild did implicitly / what its manifest struct couldn't
// express:
//   * kotlin srcDirs → ../../kotlin (xbuild flat-copied these;
//     the .kt files declare their own package).
//   * jniLibs srcDirs → cargo-ndk writes libmeditate_android.so
//     here (wired by the cargoNdkBuild task in G-2).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.janekbt.Meditate'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.janekbt.Meditate'
        minSdk 26
        targetSdk 34
        // Date-based, matching the GTK shell's yy.month.patch
        // scheme (26.7.1 = first July-2026 release). versionCode
        // is the same date flattened to yymmpp — monotonic as
        // long as patch < 100.
        versionCode 260701
        versionName '26.7.1'
    }
    sourceSets {
        main {
            kotlin.srcDirs += '../../kotlin'
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    // Debug builds are auto-signed with AGP's ~/.android/debug.keystore
    // (G-4). Release signing / F-Droid reproducible build is later.
    //
    // TEST-ONLY debug-signing shim: real release signing is
    // deferred (F-Droid signs with its own key), so assembleRelease
    // is normally unsigned and won't sideload. Point the release
    // variant at the same throwaway debug keystore purely so an
    // OPTIMIZED build can be installed on-device to measure real
    // (shipped-quality) animation smoothness. NOT production
    // signing; F-Droid ignores this and rebuilds + signs itself.
    signingConfigs {
        debugShim {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debugShim
        }
    }
}

// Build the Rust cdylib (arm64-v8a) into jniLibs before AGP
// packages natives. rust-build.sh owns the NDK linker/CC env
// (cargo-ndk's 4.x runner breaks slint's build.rs SDK lookup, so
// we drive plain `cargo build --target` ourselves). `release`
// when assembling a release variant.
tasks.register('cargoNdkBuild', Exec) {
    workingDir projectDir
    commandLine 'bash', '../rust-build.sh',
        (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            ? 'release' : 'debug')
}
tasks.named('preBuild').configure { dependsOn 'cargoNdkBuild' }
