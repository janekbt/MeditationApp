// App module. Mirrors the app/build.gradle string xbuild
// generated (gradle/mod.rs) — namespace/applicationId, the SDK
// levels, version. No `assetPacks` (the OGGs are include_bytes!'d
// in src/sounds.rs — the asset-pack path was always dead) and no
// `dependencies` (manifest.yaml declared none).
//
// Additions over the xbuild template, all required to replace
// what xbuild did implicitly / what its manifest struct couldn't
// express:
//   * kotlin srcDirs → ../../kotlin (xbuild flat-copied these;
//     the .kt files declare their own package).
//   * jniLibs srcDirs → cargo-ndk writes libmeditate_android.so
//     here (wired by the cargoNdkBuild task in G-2).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Upstream release-signing credentials, kept outside the repo so the
// keystore path and passwords are never committed. Absent on every
// machine but the maintainer's — see the signingConfigs block below
// for the fallback. Override the location with MEDITATE_SIGNING.
def debugKeystore = "${System.getProperty('user.home')}/.android/debug.keystore"
def upstreamSigning = new Properties()
def upstreamSigningPath = System.getenv('MEDITATE_SIGNING') ?: "${System.getProperty('user.home')}/.config/meditate-android/signing.properties"
if (file(upstreamSigningPath).exists()) {
    file(upstreamSigningPath).withInputStream { upstreamSigning.load(it) }
}

android {
    namespace 'io.github.janekbt.Meditate'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.janekbt.Meditate'
        minSdk 26
        targetSdk 34
        // Date-based, matching the GTK shell's yy.month.patch
        // scheme (26.8.0 = first August-2026 release; a non-zero
        // patch means a patch actually shipped that month).
        // versionCode is the same date flattened to yymmpp —
        // monotonic as long as patch < 100.
        versionCode 260803
        versionName '26.8.3'
    }
    sourceSets {
        main {
            kotlin.srcDirs += '../../kotlin'
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    // Release signing (reproducible builds). Each value comes from the
    // signing.properties above and falls back to the throwaway debug
    // keystore when that file is absent, so assembleRelease still
    // produces an installable APK for CI and for anyone building from
    // source. The fallback is harmless: F-Droid's verification compares
    // APK *payloads* and ignores the signature block, so their rebuild
    // still has to match our published binary byte for byte.
    //
    // EVERY LINE HERE MUST STAND ALONE. Before building, fdroidserver
    // (common.py remove_signing_keys) deletes the whole signingConfigs
    // block and every `signingConfig <value>` line by regex, without
    // parsing Groovy. A multi-line expression loses only its first line
    // and leaves a syntax error behind — that is exactly what broke the
    // 26.8.0 build on MR !43338. build-aux/fdroid-strip-signing.py
    // replays that stripping so repro-probe.sh catches it locally.
    signingConfigs {
        release {
            storeFile file(upstreamSigning.getProperty('storeFile', debugKeystore))
            storePassword upstreamSigning.getProperty('storePassword', 'android')
            keyAlias upstreamSigning.getProperty('keyAlias', 'androiddebugkey')
            keyPassword upstreamSigning.getProperty('keyPassword', 'android')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Build the Rust cdylib (arm64-v8a) into jniLibs before AGP
// packages natives. rust-build.sh owns the NDK linker/CC env
// (cargo-ndk's 4.x runner breaks slint's build.rs SDK lookup, so
// we drive plain `cargo build --target` ourselves). `release`
// when assembling a release variant.
tasks.register('cargoNdkBuild', Exec) {
    workingDir projectDir
    commandLine 'bash', '../rust-build.sh',
        (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            ? 'release' : 'debug')
}
tasks.named('preBuild').configure { dependsOn 'cargoNdkBuild' }
