[package]
name = "meditate-android"
version = "26.8.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Dual layout matches the canonical Slint Material Rust template:
# - the cdylib is what `cargo apk` / `xbuild` link into the APK
#   via the `android_main` symbol exported from src/lib.rs;
# - the bin lets us also `cargo run` on the host so we can iterate
#   on the .slint UI without an Android device in the loop.
#
# The lib's `name` matches the package name (dashes → underscores)
# rather than the template's `_lib` suffix: xbuild assumes lib name
# == package name when locating the cdylib for APK packaging, and
# fails with "failed to locate bin libmeditate_android.so" otherwise.
# cargo-apk would tolerate the suffix via its `--lib` flag, but we
# stay close to xbuild's expectation.
[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "meditate_android"

[[bin]]
path = "src/main.rs"
name = "meditate-android"

[dependencies]
# Pinned at template's recommended version. The
# `backend-android-activity-06` feature wires Slint to the
# android-activity 0.6 lifecycle on Android; on desktop targets
# Slint falls through to its default backend (winit + skia).
slint = { version = "1.13", features = ["backend-android-activity-06"] }

# Shared logic crate (timer, breath, db, sync, format). Milestone 4
# uses only `meditate_core::timer::Countdown`; later milestones bring
# in db / sync / breath. We depend on the whole crate rather than
# feature-gating individual modules — the compile-time hit is real
# but small relative to the slint stack, and per-module gates would
# turn meditate-core into a maintenance burden.
meditate-core = { path = "../meditate-core" }

# Already resolved transitively (meditate-core depends on
# serde_json 1) so this adds no extra compile to the build —
# declaring it directly just lets `widget.rs` serialize the
# home-screen-widget preset projection. Kept in the general
# `[dependencies]` (not the android-only table) so the pure
# `build_projection_json` + its tests compile and run on the
# host `cargo test --workspace`. `json!` macro only — no derive.
serde_json = "1"

# chrono: date arithmetic for the Material DatePickerAdapter
# wiring (Edit-Session start-time editor). `default-features = false`
# strips clock/now and the std-only "Format" path that pulls in
# `iana-time-zone` — we get NaiveDate's day-count / parse / format
# helpers without the timezone-DB churn. `clock` is re-enabled
# explicitly because the adapter's `date_now` callback needs
# `chrono::Local::now()` to seed the picker on first open.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# jni: thin wrapper over Android's JNI for calling the Kotlin
# MeditateSessionService.start/stop static methods from Rust. Only
# linked on android-targets via the cfg gate in `src/service.rs`;
# host (`cargo run`) builds skip the dependency at link time.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# android-activity exposes the AndroidApp's vm()+activity() pointers
# we need for the JNI bridge. Pin to whatever slint-1.13's
# `backend-android-activity-06` feature resolves to (0.6.x).
android-activity = "0.6"

[build-dependencies]
slint-build = "1.13"

# Android manifest config lives in `manifest.yaml` at the package
# root, NOT here — current xbuild (LAGonauta fork tracking PR #224)
# reads `<package_root>/manifest.yaml`, never the
# `[package.metadata.android]` Cargo metadata table. A legacy
# cargo-apk-era block previously sat here and was silently ignored.
