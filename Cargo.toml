[workspace]
resolver = "2"
members = [
    "meditate-core",
    "meditate-gtk",
    "meditate-android",
]
# `cargo build` / `cargo test` at the workspace root operates on the
# GTK shell + its core dep — the host build that has shipped to
# Flathub and the Librem 5 since 26.4.4. The Android shell builds
# only when explicitly targeted (xbuild / cargo apk / `-p meditate-android`)
# so the Linux flow stays the default and a host `cargo build` doesn't
# pull android-activity into the link graph.
default-members = ["meditate-gtk"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Strip debuginfo from the dev profile too: the Android native lib
# (libmeditate_android.so) is ~329 MB unstripped, which makes every
# wireless-adb deploy crawl. debuginfo-stripped it is ~20-40 MB and
# installs in seconds. Local backtraces lose line numbers; logcat
# panics still carry the message, which is enough for on-device work.
[profile.dev]
strip = "debuginfo"

# Slint bundles translations in whatever order the filesystem returns the
# `lang/` entries in, so the generated string table differs between machines
# and F-Droid's build can never match our published APK. This is stock
# Slint 1.16.1 plus one commit that sorts those entries; the same fix is
# proposed upstream in slint-ui/slint#12932, and this patch goes away once a
# release carries it.
#
# Pinned to an immutable rev (tag v1.16.1-sort-translations) rather than a
# branch: a moving ref would defeat the reproducibility this exists for.
# Only the build-time code generator is patched — the fork's copy reaches us
# through build-dependencies and proc-macros, never the shipped library.
[patch.crates-io]
i-slint-compiler = { git = "https://github.com/janekbt/slint", rev = "a82420a30f09877bd291c23cc7eddc75ba30737a" }
