[workspace]
resolver = "2"
members = [
    "meditate-core",
    "meditate-gtk",
]
# `cargo build` / `cargo test` at the workspace root operates on the
# GTK shell + its core dep — the host build that has shipped to
# Flathub and the Librem 5 since 26.4.4. The Android shell, when it
# arrives in milestone 3, will be added to `members` but kept out of
# `default-members` so the Linux flow stays the default.
default-members = ["meditate-gtk"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
