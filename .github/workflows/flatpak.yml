name: Flatpak CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: run CI on any branch (e.g. beta) without paying for CI
  # on every push. Use the "Run workflow" button under the Actions tab and
  # pick the branch to test.
  workflow_dispatch:

jobs:
  # Cheap, fast-failing job: catches metainfo schema breakage before either
  # Flatpak build spends 10 minutes compiling.
  metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net meditate-gtk/data/io.github.janekbt.Meditate.metainfo.xml.in
      - name: Validate desktop entry
        # desktop-file-validate insists on a .desktop suffix; copy into a
        # tempdir rather than renaming the source-of-truth file.
        run: |
          tmp=$(mktemp -d)
          cp meditate-gtk/data/io.github.janekbt.Meditate.desktop.in "$tmp/io.github.janekbt.Meditate.desktop"
          desktop-file-validate "$tmp/io.github.janekbt.Meditate.desktop"

  # Unit tests + lints for the two crates that build on a plain
  # runner. The GTK shell needs GTK 4.18 (ubuntu-latest ships
  # 4.14), so it is compile-proven by the Flatpak jobs below
  # instead; core + android need no system libs (the android lib
  # is cfg-gated on host, exactly like the local test gate).
  tests:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo test
        run: cargo test -p meditate-core -p meditate-android --lib
      - name: cargo clippy
        run: cargo clippy -p meditate-core -p meditate-android --lib -- -D warnings

  # Android APK — release-config (debug-keystore-signed; fine for
  # sideloading, F-Droid re-signs). The runner image ships the
  # Android SDK; we add the pinned NDK and let the committed
  # gradle wrapper drive rust-build.sh (which needs only
  # ANDROID_NDK_ROOT / ANDROID_HOME when env.sh is absent).
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
               "ndk;27.2.12479018" "platforms;android-34" "build-tools;35.0.0"
      - name: Build APK
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: cd meditate-android/android && ./gradlew :app:assembleRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: meditate-android.apk
          path: meditate-android/android/app/build/outputs/apk/release/app-release.apk

  # x86_64: job-level container runs as root — the action works out of the box.
  flatpak-x86_64:
    name: Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: meditate-x86_64.flatpak
          manifest-path: build-aux/io.github.janekbt.Meditate.json
          cache-key: flatpak-builder-x86_64-${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: meditate-x86_64.flatpak
          path: meditate-x86_64.flatpak

  # aarch64: QEMU binfmt must be registered on the host *before* the container
  # that needs it starts.  Job-level containers prevent running host steps first,
  # so we (1) register binfmt via a plain `docker run`, then (2) start the
  # gnome-50 container ourselves — it runs as root so runtime installs succeed.
  flatpak-aarch64:
    name: Flatpak (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Register QEMU binfmt for aarch64
        run: docker run --privileged --rm tonistiigi/binfmt --install aarch64

      - name: Build aarch64 Flatpak
        run: |
          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ghcr.io/flathub-infra/flatpak-github-actions:gnome-50 \
            bash -c '
              set -e
              flatpak remote-add --if-not-exists flathub \
                https://dl.flathub.org/repo/flathub.flatpakrepo
              xvfb-run flatpak-builder \
                --repo=repo \
                --disable-rofiles-fuse \
                --install-deps-from=flathub \
                --force-clean \
                --arch=aarch64 \
                flatpak_app \
                build-aux/io.github.janekbt.Meditate.json
              flatpak build-bundle \
                --arch=aarch64 \
                repo \
                meditate-aarch64.flatpak \
                io.github.janekbt.Meditate
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: meditate-aarch64.flatpak
          path: meditate-aarch64.flatpak
