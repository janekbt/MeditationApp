    versionCode: 260801
    commit: 031e556e3b8722ad6c373f0eae9d0214eeb1813c
    subdir: meditate-android/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y rustup gcc libc-dev openjdk-17-jdk-headless
      - update-java-alternatives --set java-1.17.0-openjdk-amd64
    gradle:
      - yes
    prebuild:
      - rustup default 1.95.0
      - rustup target add aarch64-linux-android
    ndk: r27c

