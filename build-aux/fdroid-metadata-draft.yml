# Metadata for the fdroiddata merge request — copy to
# metadata/io.github.janekbt.Meditate.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open the MR.
# v26.7.1 is tagged on main; reviewers may adjust field style.
Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Janek
SourceCode: https://github.com/janekbt/MeditationApp
IssueTracker: https://github.com/janekbt/MeditationApp/issues
Changelog: https://github.com/janekbt/MeditationApp/blob/main/fastlane/metadata/android/en-US/changelogs/

AutoName: Meditate

RepoType: git
Repo: https://github.com/janekbt/MeditationApp.git

Builds:
  - versionName: 26.7.1
    versionCode: 260701
    commit: v26.7.1
    subdir: meditate-android/android
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends curl ca-certificates
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > /tmp/rustup.sh
      - chmod +x /tmp/rustup.sh
      - su vagrant -c '/tmp/rustup.sh -y --default-toolchain 1.95.0 --target aarch64-linux-android --component clippy --no-modify-path'
    init:
      # rust-build.sh sources ~/.config/meditate-android/env.sh when
      # present (dev machines); on the buildserver it falls back to
      # ANDROID_NDK_ROOT / ANDROID_NDK_HOME / ANDROID_NDK, which
      # fdroidserver exports from the ndk pin below. cargo/rustc come
      # from rustup's default location.
      - export PATH="$HOME/.cargo/bin:$PATH"
    gradle:
      - yes
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 26.7.1
CurrentVersionCode: 260701
